name: Sync Streams

permissions:
  contents: read

on:
  schedule:
    - cron: '*/5 * * * *' 
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests playwright rapidfuzz deep-translator
          playwright install chromium
      - name: Run script
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python sync.py
